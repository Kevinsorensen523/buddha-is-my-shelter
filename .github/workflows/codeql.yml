name: CodeQL

# Covers Go, JavaScript, Java, and Python. PHP is intentionally absent --
# CodeQL does not support PHP analysis (see php-review's phpstan job in
# ci.yml for that language's static analysis instead).

# SECURITY: pull_request is deliberately NOT a trigger here, same reasoning
# as ci.yml -- this runs on a self-hosted runner (the repo owner's own
# machine), and a self-hosted runner triggered by pull_request on a public
# repo would let anyone who forks this repo run arbitrary code on that
# machine via a PR. push and the weekly schedule only ever run code already
# on the default branch, which only the repo owner (or anyone else with
# write access) controls.
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 3 * * 2'  # weekly, Tuesday 03:20 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: self-hosted
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
            working-dir: go
          - language: javascript-typescript
            build-mode: none
            working-dir: javascript
          - language: java-kotlin
            build-mode: autobuild
            working-dir: java
          - language: python
            build-mode: none
            working-dir: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          source-root: ${{ matrix.working-dir }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
