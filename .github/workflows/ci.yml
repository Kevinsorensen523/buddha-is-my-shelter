name: CI

# Runs on a self-hosted runner (the repo owner's own machine), not
# GitHub-hosted runners -- see the comment block below for why, and the
# critical security constraint that comes with it.
#
# SECURITY: pull_request is deliberately NOT a trigger here. A self-hosted
# runner on a public repo that runs on pull_request would let anyone who
# forks this repo submit a PR that executes arbitrary code on the repo
# owner's own machine (GitHub explicitly warns about this). Restricting to
# push (which only the repo owner, or anyone else with write access, can
# do) closes that attack surface entirely. Do not add pull_request back
# without also enabling "Require approval for all outside collaborators"
# in Settings > Actions > General, and understanding that even with
# approval, a self-hosted runner is still less isolated than GitHub's
# ephemeral hosted runners.
on:
  push:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: self-hosted
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false  # self-hosted runner's disk persists between runs -- GitHub's remote cache upload/download is redundant here and was hanging
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v -race
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec ./...

  php:
    name: PHP
    runs-on: self-hosted
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse src --level=5

  python:
    name: Python
    runs-on: self-hosted
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: bandit -r securekit

  javascript:
    name: JavaScript
    runs-on: self-hosted
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache: option -- self-hosted runner's disk persists between
          # runs, so GitHub's remote cache upload/download is redundant
          # here (and was hanging on a large upload).
      - run: npm install
      - run: npm test
      - run: npm run lint

  java:
    name: Java
    runs-on: self-hosted
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # No cache: option -- self-hosted runner's disk (including
          # ~/.m2) persists between runs, so GitHub's remote cache
          # upload/download is redundant here.
      - run: mvn -B test
      - run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:check
